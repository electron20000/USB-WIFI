name: Build Android APK (auto detect module)

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
  pull_request:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Informacyjnie – pokaże w logu jakie są moduły
      - name: Show Gradle projects
        run: ./gradlew projects

      # Buduje WSZYSTKIE debug APK niezależnie od nazwy modułu
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Debug: pokaż gdzie są APK
      - name: List APK files
        run: |
          echo "APK files found:"
          find . -type f -path "*/build/outputs/apk/*/*.apk" -print || true

      # Upload gotowych APK do pobrania
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: |
            **/build/outputs/apk/**/*.apk
